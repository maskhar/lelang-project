name: lelang-backend-dev
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: lelang_properti_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lelang_properti_dev"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
volumes:
  database:
